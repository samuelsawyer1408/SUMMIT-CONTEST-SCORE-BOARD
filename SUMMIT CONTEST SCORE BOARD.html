<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Summit Score Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#091C22;--panel:#12343D;--line:#24515B;--cyan:#43C0D5;--mute:#8AB2BF;--text:#F0F7FA;--ok:#00E676;--bad:#FF4545}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 Barlow,system-ui,sans-serif}
main{max-width:1180px;margin:0 auto;padding:24px 16px 60px}
h1,h2,.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.02em}
h1{font-size:40px;margin:0}h2{font-size:24px;margin:28px 0 10px}
.sub{color:var(--mute);margin:0 0 18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:block;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
input,select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit}
input:focus,button:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
input[type=range]{padding:0}
.total{font-size:56px;line-height:1;color:var(--cyan);font-weight:700}
.bar{display:flex;gap:4px;margin:8px 0 4px}.bar i{flex:1;height:8px;background:var(--line);border-radius:2px}.bar i.on{background:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:8px}
.card.ok{border-left-color:var(--ok)}.card.bad{border-left-color:var(--bad)}
.hd{display:flex;justify-content:space-between;align-items:center}
.hd b{font:700 22px "Barlow Condensed",sans-serif;color:var(--cyan)}
.st{display:flex;align-items:center;gap:8px;font:700 22px "Barlow Condensed",sans-serif}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--mute);display:inline-grid;place-items:center;font-size:13px;color:var(--bg)}
.ok .dot{background:var(--ok);border-color:var(--ok)}.bad .dot{background:var(--bad);border-color:var(--bad)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
button,.btn{background:transparent;color:var(--cyan);border:1px solid var(--cyan);border-radius:6px;padding:9px 14px;font:600 15px "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
button:hover,.btn:hover{background:rgba(67,192,213,.14)}
button.main{background:var(--cyan);color:var(--bg);font-size:18px;padding:12px 20px}
button.warn{color:var(--bad);border-color:var(--bad)}
.pv{width:100%;aspect-ratio:16/9;display:block;border:1px solid var(--cyan);border-radius:6px;box-shadow:0 0 24px rgba(67,192,213,.2)}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--cyan);padding:10px 18px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
#msg.show{opacity:1}#msg.err{border-color:var(--bad)}
</style>
</head>
<body>
<main>
<h1>Weekly Summit Score Tracker</h1>
<p class="sub">Enter your nine summit scores, preview the poster live, then export it as a 1920 × 1080 PNG.</p>

<section class="panel" aria-label="Summit configuration">
 <div class="row">
  <div><label for="name">Weekly summit contest name</label><input id="name" maxlength="60"></div>
  <div><label for="final">Final summit score</label><input id="final" type="number" min="0" step="1" inputmode="numeric" placeholder="Enter the in-game total"></div>
 </div>
</section>

<h2>Summit activities</h2>
<section class="grid" id="cards" aria-label="Nine summit activities"></section>

<h2>Poster background</h2>
<section class="panel row" style="align-items:end">
 <div><label for="file">Poster image (PNG, JPG, WebP)</label><input id="file" type="file" accept="image/png,image/jpeg,image/webp"></div>
 <div><label for="op">Opacity: <span id="opv">12</span>%</label><input id="op" type="range" min="3" max="25" value="12"></div>
 <div><button id="rmImg">Remove image</button></div>
</section>

<h2>Poster preview</h2>
<canvas id="pv" class="pv" width="1920" height="1080" aria-label="Poster preview"></canvas>
<div class="btns">
 <button class="main" id="dl">Download summit poster (PNG)</button>
 <button id="save">Save data</button>
 <label class="btn" style="margin:0;color:var(--cyan)">Load data<input id="load" type="file" accept=".json,application/json" hidden></label>
 <button id="clr">Clear scores</button>
 <button class="warn" id="reset">Reset all</button>
</div>
</main>
<div id="msg" role="status" aria-live="polite"></div>

<script>
"use strict";
const THRESH=130000, KEY="summitTracker.v1", F='"Barlow Condensed","Arial Narrow",sans-serif';
const C={bg:"#091C22",panel:"#12343D",line:"#24515B",cyan:"#43C0D5",mute:"#8AB2BF",text:"#F0F7FA",ok:"#00E676",bad:"#FF4545"};
const blank=()=>({name:"WEEKLY SUMMIT",final:"",opacity:12,img:null,
  acts:Array.from({length:9},(_,i)=>({name:"SUMMIT ACTIVITY 0"+(i+1),score:null}))});
let S=blank(), bgImg=null;
const $=id=>document.getElementById(id), cv=$("pv"), ctx=cv.getContext("2d");
const fmt=n=>Number(n).toLocaleString("en-US");
const status=s=>s==null?"":s>=THRESH?"ok":"bad";

function toast(t,err){const m=$("msg");m.textContent=t;m.className="show"+(err?" err":"");clearTimeout(toast.t);toast.t=setTimeout(()=>m.className="",3000)}

/* ---------- build the nine cards ---------- */
function buildCards(){
 $("cards").innerHTML=S.acts.map((a,i)=>`<article class="card" id="c${i}">
  <div class="hd"><b>ACTIVITY ${i+1}</b><span class="st"><span class="dot" aria-hidden="true"></span><span class="sv"></span></span></div>
  <div><label for="n${i}">Summit activity name</label><input id="n${i}" data-i="${i}" data-k="name" maxlength="40"></div>
  <div><label for="s${i}">Score points</label><input id="s${i}" data-i="${i}" data-k="score" type="number" min="0" step="1" inputmode="numeric"></div>
  </article>`).join("");
}
function fillForm(){
 $("name").value=S.name;$("final").value=S.final;
 $("op").value=S.opacity;$("opv").textContent=S.opacity;
 S.acts.forEach((a,i)=>{const set=(p,v)=>$(p+i).value=v??"";set("n",a.name);set("s",a.score)});
}
const shownTotal=()=>S.final===""||isNaN(+S.final)?null:Math.max(0,Math.floor(+S.final));

function refresh(){
 S.acts.forEach((a,i)=>{const c=$("c"+i),st=status(a.score);c.className="card "+st;
  c.querySelector(".dot").textContent=st==="ok"?"✓":st==="bad"?"!":"";
  c.querySelector(".sv").textContent=a.score==null?"NO SCORE":fmt(a.score)+" PTS"});
 draw();
 try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){/* storage full or blocked: ignore */}
}

/* ---------- events ---------- */
$("name").oninput=e=>{S.name=e.target.value;refresh()};
$("final").oninput=e=>{const t=e.target;
 if(t.value!==""&&(!isFinite(+t.value)||+t.value<0)){t.value="";S.final="";toast("The final score must be zero or higher.",true)}else S.final=t.value;
 refresh()};
$("op").oninput=e=>{S.opacity=+e.target.value;$("opv").textContent=S.opacity;refresh()};
$("cards").addEventListener("input",e=>{
 const t=e.target,i=t.dataset.i,k=t.dataset.k;if(i==null)return;
 if(k==="score"){
  if(t.value===""){S.acts[i].score=null}
  else{const v=Number(t.value);
   if(!isFinite(v)||v<0){S.acts[i].score=null;t.value="";toast("Scores must be zero or higher.",true)}
   else S.acts[i].score=Math.floor(v)}
 } else S.acts[i][k]=t.value;
 refresh();
});

/* ---------- background image ---------- */
function setImg(url,cb){const im=new Image();im.onload=()=>{bgImg=im;cb&&cb()};im.onerror=()=>{toast("That image could not be loaded.",true)};im.src=url}
$("file").onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 if(!/^image\/(png|jpe?g|webp)$/.test(f.type)){toast("Use a PNG, JPG or WebP image.",true);return}
 const r=new FileReader();r.onload=()=>{S.img=r.result;setImg(r.result,refresh);toast("Poster image added.")};r.readAsDataURL(f);
};
$("rmImg").onclick=()=>{S.img=null;bgImg=null;$("file").value="";refresh();toast("Poster image removed.")};

/* ---------- canvas poster (always 1920x1080) ---------- */
function fit(t,w,size,wt){ // shrink font until text fits width
 let s=size;ctx.font=`${wt||700} ${s}px ${F}`;
 while(ctx.measureText(t).width>w&&s>12){s-=2;ctx.font=`${wt||700} ${s}px ${F}`}
}
function txt(t,x,y,w,size,color,align,wt){fit(t,w,size,wt);ctx.fillStyle=color;ctx.textAlign=align||"left";ctx.fillText(t,x,y)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}

function draw(){
 const W=1920,H=1080;ctx.clearRect(0,0,W,H);ctx.textBaseline="alphabetic";
 let g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,"#0d2a32");g.addColorStop(1,C.bg);
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 if(bgImg){ // cover-fit, no stretching
  const k=Math.max(W/bgImg.width,H/bgImg.height),w=bgImg.width*k,h=bgImg.height*k;
  ctx.globalAlpha=S.opacity/100;ctx.drawImage(bgImg,(W-w)/2,(H-h)/2,w,h);ctx.globalAlpha=1;
  ctx.fillStyle="rgba(9,28,34,.45)";ctx.fillRect(0,0,W,H);
 }
 // header
 txt("THE CREW MOTORFEST  |  WEEKLY SUMMIT",60,58,900,30,C.cyan,"left",600);
 txt((S.name||"WEEKLY SUMMIT").toUpperCase(),60,140,W-120,88,C.text);
 ctx.fillStyle=C.cyan;ctx.fillRect(60,160,160,4);
 // 3x3 grid
 const gx=60,gy=190,gap=22,cw=(W-120-gap*2)/3,ch=215;
 S.acts.forEach((a,i)=>{
  const x=gx+(i%3)*(cw+gap),y=gy+Math.floor(i/3)*(ch+gap),st=status(a.score),col=st==="ok"?C.ok:st==="bad"?C.bad:C.line;
  ctx.fillStyle="rgba(18,52,61,.86)";rr(x,y,cw,ch,10);ctx.fill();
  ctx.strokeStyle=C.cyan;ctx.lineWidth=1.5;ctx.shadowColor="rgba(67,192,213,.35)";ctx.shadowBlur=10;ctx.stroke();ctx.shadowBlur=0;
  ctx.fillStyle=col;ctx.fillRect(x+1,y+14,6,ch-28);
  txt(String(i+1).padStart(2,"0"),x+26,y+40,60,30,C.cyan);
  txt((a.name||"").toUpperCase(),x+84,y+40,cw-84-20,34,C.text);
  // score
  const has=a.score!=null;
  txt(has?fmt(a.score):"—",x+26,y+170,cw-150,84,has?C.text:C.mute);
  if(has){fit(fmt(a.score),cw-150,84);const sw=ctx.measureText(fmt(a.score)).width;
   txt("PTS",x+26+sw+10,y+170,70,26,C.mute,"left",600)}
 });
 // footer
 const fy=gy+3*ch+2*gap+22,fh=H-fy-34;
 ctx.fillStyle="rgba(18,52,61,.9)";rr(60,fy,W-120,fh,10);ctx.fill();ctx.strokeStyle=C.cyan;ctx.lineWidth=1.5;ctx.stroke();
 txt("FINAL SUMMIT SCORE",90,fy+36,500,24,C.mute,"left",600);
 {const t=shownTotal();txt(t==null?"—":fmt(t)+" PTS",90,fy+fh-24,640,70,t==null?C.mute:C.cyan)}
}

/* ---------- downloads / data ---------- */
function save(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
const slug=()=>(S.name||"Weekly_Summit").trim().replace(/[^\w\-]+/g,"_").replace(/^_+|_+$/g,"")||"Weekly_Summit";
$("dl").onclick=()=>{
 try{draw();cv.toBlob(b=>{if(!b){toast("PNG export failed.",true);return}save(b,slug()+"_Poster.png");toast("Poster downloaded (1920 × 1080).")},"image/png")}
 catch(e){toast("PNG export failed: "+e.message,true)}
};
$("save").onclick=()=>{try{save(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}),slug()+"_data.json");toast("Data saved as JSON.")}catch(e){toast("Save failed.",true)}};
$("load").onchange=e=>{
 const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{
  const d=JSON.parse(r.result);if(!d||!Array.isArray(d.acts)||d.acts.length!==9)throw 0;
  const b=blank();S=Object.assign(b,d,{acts:d.acts.map((a,i)=>Object.assign(b.acts[i],a,{score:a.score===""||a.score==null||!(a.score>=0)?null:Math.floor(+a.score)}))});
  S.final=S.final===""||S.final==null||!(+S.final>=0)?"":String(Math.floor(+S.final));
  S.opacity=Math.min(25,Math.max(3,+S.opacity||12));
  fillForm();bgImg=null;S.img?setImg(S.img,refresh):refresh();toast("Data loaded.");
 }catch(x){toast("That file is not a valid summit data file.",true)}e.target.value=""};
 r.readAsText(f);
};
$("clr").onclick=()=>{S.acts.forEach(a=>a.score=null);fillForm();refresh();toast("Scores cleared.")};
$("reset").onclick=()=>{if(!confirm("Reset everything to the default empty state?"))return;S=blank();bgImg=null;$("file").value="";fillForm();refresh();toast("Reset complete.")};

/* ---------- init ---------- */
buildCards();
try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.acts)&&d.acts.length===9){const b=blank();S=Object.assign(b,d,{acts:d.acts.map((a,i)=>Object.assign(b.acts[i],a))})}}catch(e){}
fillForm();
(S.img?new Promise(r=>setImg(S.img,r)):Promise.resolve()).then(refresh);
if(document.fonts)Promise.all(["700 20px \"Barlow Condensed\"","600 20px \"Barlow Condensed\"","500 20px \"Barlow Condensed\""].map(f=>document.fonts.load(f))).then(draw).catch(()=>{});
</script>
</body>
</html>
